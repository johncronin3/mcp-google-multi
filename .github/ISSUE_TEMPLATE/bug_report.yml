name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Do not paste OAuth tokens, client secrets, authorization codes, or `.env` contents.** For security vulnerabilities, use private reporting instead — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line of `mcp-google-multi doctor` (or the npm version / release tag you installed).
      placeholder: "6.x.y"
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool / service?
      options:
        - Gmail
        - Drive
        - Calendar
        - Sheets
        - Docs
        - Contacts
        - Search Console
        - Tasks
        - Meet
        - Slides (optional bundle)
        - Forms (optional bundle)
        - Chat (optional bundle)
        - Analytics (optional bundle)
        - Admin (per-account admin opt-in)
        - Another generated service (see COVERAGE.md)
        - Escape hatch (google_api_search / google_api_call)
        - Auth / setup
        - HTTP transport / OAuth server
        - Other
    validations:
      required: true
  - type: input
    id: account-type
    attributes:
      label: Account type
      description: Workspace or personal @gmail.com? (Some tools, e.g. Chat/Admin, are Workspace-only.)
      placeholder: "Workspace / personal"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact tool call / inputs (with secrets redacted).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Relevant stderr or error payload. Redact any tokens or emails you don't want public.
      render: shell
